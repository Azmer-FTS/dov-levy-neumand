<html lang="fr">

<style>
:root{
  --papier:#f6f1e8; --papier-2:#efe8dc; --encre:#2b2621; --doux:#6f655a; --trait:#ddd3c4;
  --accent:#7a3b2e; --ombre:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.06);
  --titre:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --texte:"Source Serif 4",Georgia,"Times New Roman",serif;
  --hebreu:"Frank Ruhl Libre","Source Serif 4",Georgia,serif;
  --h:118px;
}
@media (min-width:480px){ :root{--h:150px} }
@media (min-width:700px){ :root{--h:220px} }
@media (min-width:1100px){ :root{--h:260px} }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--texte);
  font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased}
:lang(he),[dir=rtl]{font-family:var(--hebreu)}
a{color:var(--accent)}
.page{max-width:1180px;margin:0 auto;padding:0 16px}
.colonne{max-width:680px;margin:0 auto}

/* ── LE HÉROS (63e) — Dov : « UN SEUL HÉROS, PAS DEUX ». ──────────────────────
   Un écran : son nom en haut, le pêle-mêle des photos dessous, et sur l'une
   d'elles le bouton de lecture du montage. Juste en dessous : les chapitres. */
.heros{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  padding:max(22px,env(safe-area-inset-top)) 16px 0;overflow:hidden}
header.tete{text-align:center;flex:none}
.insecable{white-space:nowrap}
.tete h1{font-family:var(--titre);font-weight:500;font-size:clamp(36px,10vw,80px);line-height:1.02;margin:0;letter-spacing:.005em}
.tete .dates{font-family:var(--titre);font-size:clamp(20px,4.2vw,30px);color:var(--doux);margin:.15em 0 0;letter-spacing:.08em}
.tete .nom-he{font-family:var(--hebreu);font-size:clamp(20px,4.4vw,30px);margin:.25em 0 0}
.tete .ligne{margin:.5em auto 0;max-width:32em;color:var(--doux)}
.tete .ligne p{margin:0;font-size:clamp(16px,3.6vw,21px);line-height:1.4}
.tete .ligne p:lang(fr){font-style:italic}
.tete .ligne p:empty,.tete p:empty{display:none}
/* Le pêle-mêle : des tirages posés de travers, jamais recadrés, qui se
   chevauchent un peu. Leur place est calculée sur la taille de l'écran. */
.pelemele{position:relative;flex:1 1 auto;min-height:300px;margin:10px -6px 0}
.tirage{all:unset;position:absolute;box-sizing:border-box;padding:var(--bord,4px);background:#fffdf8;cursor:zoom-in;
  box-shadow:0 1px 2px rgba(50,30,10,.18),0 8px 22px rgba(50,30,10,.16);border-radius:2px;
  opacity:0;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.tirage.vu{opacity:1}
.tirage img{display:block;width:100%;height:100%;object-fit:cover;background:var(--papier-2)}
.tirage:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tirage.lecture{cursor:pointer;z-index:5}
.tirage .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.tirage .rond{width:68px;height:68px;border-radius:50%;background:rgba(20,16,12,.58);border:2px solid rgba(255,253,248,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.35);transition:transform .2s ease,background .2s ease}
.tirage .rond svg{width:26px;height:26px;margin-left:5px;fill:#fffdf8}
.tirage .mot{font-size:15px;line-height:1.2;color:#fffdf8;background:rgba(20,16,12,.58);padding:5px 11px;border-radius:999px;white-space:nowrap}
.tirage.lecture:hover .rond,.tirage.lecture:focus-visible .rond{transform:scale(1.07);background:rgba(122,59,46,.85)}
.vers-sommaire{flex:none;display:block;text-align:center;padding:12px 0 calc(14px + env(safe-area-inset-bottom));color:var(--doux);
  text-decoration:none;font-size:17px;min-height:44px}
.vers-sommaire:hover,.vers-sommaire:focus-visible{color:var(--accent)}
@media (min-width:700px){.heros{padding-top:34px}.pelemele{margin:18px 0 0}.tirage{--bord:6px}.tirage .rond{width:84px;height:84px}.tirage .rond svg{width:32px;height:32px}.tirage .mot{font-size:16px}}
@media (prefers-reduced-motion:reduce){.tirage{transition:none}}
.fleuron{display:block;width:72px;height:1px;background:var(--trait);margin:28px auto;border:0}

/* LE SOMMAIRE — 63e : il se voit d'un coup d'œil, même sur un téléphone.
   Deux colonnes au téléphone, trois sur un écran large ; une ligne par chapitre. */
nav.sommaire{margin:0 auto;max-width:900px;padding:22px 0 0}
nav.sommaire h2{font-family:var(--titre);font-weight:500;font-size:24px;text-align:center;margin:0 0 8px;color:var(--doux)}
nav.sommaire ol{list-style:none;margin:0;padding:0;columns:2;column-gap:14px}
@media (min-width:700px){nav.sommaire ol{columns:3;column-gap:32px}}
nav.sommaire li{break-inside:avoid;border-bottom:1px solid var(--trait)}
nav.sommaire a{display:flex;align-items:center;gap:6px;min-height:44px;padding:3px 0;color:var(--encre);text-decoration:none;font-size:15.5px;line-height:1.22}
@media (min-width:700px){nav.sommaire a{font-size:17px}}
nav.sommaire a:hover,nav.sommaire a:focus-visible{color:var(--accent)}
nav.sommaire .n{flex:none;min-width:1.5em;color:var(--doux);font-size:13px;font-variant-numeric:tabular-nums}

/* UN CHAPITRE */
section.chapitre{padding:28px 0 12px;scroll-margin-top:60px}
nav.sommaire{scroll-margin-top:0}
.chapitre header{text-align:center;margin:0 auto 26px}
.chapitre .num{font-family:var(--titre);color:var(--doux);font-size:18px;letter-spacing:.2em;text-transform:uppercase}
.chapitre h2{font-family:var(--titre);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:.1em 0 0}
.chapitre .titre-he{font-family:var(--hebreu);font-size:clamp(22px,4vw,28px);color:var(--doux);margin:.3em 0 0}
.recit,.texte{margin:0 auto 30px}
.recit p,.texte p{margin:0 0 1em;white-space:pre-line}
.recit{font-size:20px}
.texte p.citation{font-style:italic;font-size:20px}
.texte p.auteur{color:var(--doux);font-size:16px;margin-top:-.5em}
.texte p[dir=rtl]{text-align:right}

/* LES PHOTOS — en rangs, sans rien recadrer, dans l'ordre */
.galerie{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
@media (min-width:700px){.galerie{gap:12px}}
.galerie::after{content:"";flex-grow:999999}
/* ⚠ une photo seule au bout d'un rang ne grandit pas sans fin */
.galerie figure{margin:0;flex:var(--r) 1 calc(var(--r) * var(--h));min-width:0;max-width:min(100%,calc(var(--r) * var(--h) * 2.2))}
/* 62e — une photo très étroite (une statue debout) ne descend pas sous 120 px : sa légende s'écrivait un mot par ligne. */
.galerie figure:has(figcaption){min-width:min(100%,120px)}
.galerie button{all:unset;display:block;width:100%;cursor:zoom-in;border-radius:3px;overflow:hidden;
  background:var(--papier-2);box-shadow:var(--ombre)}
.galerie button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.galerie img{display:block;width:100%;height:auto;aspect-ratio:var(--w)/var(--hh);object-fit:cover;
  transition:opacity .4s ease;opacity:0}
.galerie img.vu{opacity:1}
.galerie figcaption{font-size:15.5px;line-height:1.4;color:var(--doux);padding:7px 2px 0;overflow-wrap:anywhere}
/* ⛔ 62e — UNE LÉGENDE QUI VAUT POUR PLUSIEURS PHOTOS VOISINES S'ÉCRIT UNE FOIS,
   sous le groupe entier, jamais recopiée sous chacune. */
.groupe{margin:0 0 24px;padding-bottom:10px;border-bottom:1px solid var(--trait)}
.groupe .galerie{margin-bottom:0}
.groupe .legende-groupe{font-size:15.5px;line-height:1.4;color:var(--doux);margin:8px 2px 0;overflow-wrap:anywhere}

/* ── LE MONTAGE (62e) — 63e : il ne s'ouvre plus de lui-même. Il attend
   derrière le bouton de lecture du pêle-mêle, et s'ouvre PAR-DESSUS la page,
   en plein écran ; on le ferme, on retrouve le pêle-mêle.
   Deux couches d'image qui se relaient en fondu ; un mouvement lent sur la
   photo ; derrière, la même photo floutée pour remplir l'écran sans rien
   recadrer. Rien que du CSS composité : ni bibliothèque, ni vidéo. */
.montage{position:fixed;inset:0;z-index:30;overflow:hidden;background:#1d1915;color:#f6f1e8}
.montage[hidden]{display:none}
.montage .couche{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.montage .couche.active{opacity:1}
.montage .flou{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.montage .couche img{position:absolute;top:0;left:0;right:0;bottom:var(--bas,0px);width:100%;height:calc(100% - var(--bas,0px));object-fit:contain;transform-origin:var(--ox,50%) var(--oy,50%)}
.montage .couche.active img{animation:lent 9s ease-out forwards}
@keyframes lent{from{transform:scale(1)}to{transform:scale(1.07)}}
.montage .voile{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(20,16,12,.82),rgba(20,16,12,0));pointer-events:none}
.montage .nom{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;padding:0 16px;margin:0;
  font-family:var(--titre);font-weight:500;font-size:clamp(34px,8.5vw,72px);line-height:1.05;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.montage .nom .an{display:block;font-size:.5em;letter-spacing:.1em;opacity:.85;margin-top:.15em}
.montage .passe{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;margin:0 auto;padding:0 20px;max-width:760px;
  font-size:clamp(17px,4.2vw,22px);line-height:1.35;font-style:italic;min-height:1.4em;opacity:0;transition:opacity .9s ease;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.montage .passe.vue{opacity:.95}
.montage .fermer-montage{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:2;font:inherit;font-size:16px;color:#f6f1e8;
  background:rgba(30,24,18,.6);border:1px solid rgba(246,241,232,.45);border-radius:999px;padding:10px 16px;min-height:48px;cursor:pointer}
.montage .fermer-montage:focus-visible{outline:3px solid #f6f1e8;outline-offset:2px}
.montage .musique{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2;font:inherit;font-size:16px;color:#f6f1e8;
  background:rgba(30,24,18,.6);border:1px solid rgba(246,241,232,.45);border-radius:999px;padding:10px 16px;min-height:48px;cursor:pointer}
.montage .musique:focus-visible{outline:3px solid #f6f1e8;outline-offset:2px}
.montage .musique[aria-pressed=true]{background:rgba(246,241,232,.94);color:var(--encre)}
/* Un téléphone tenu droit : la photo en haut, les mots en dessous, jamais dessus. */
@media (max-aspect-ratio:4/5){.montage{--bas:190px}.montage .couche img{top:calc(72px + env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){.montage .couche.active img{animation:none}}

/* ── LA BARRE DES CHAPITRES (62e) — toujours là une fois dans l'album ────── */
.barre{position:fixed;top:0;left:0;right:0;z-index:10;height:56px;display:flex;align-items:center;gap:4px;
  padding:0 max(6px,env(safe-area-inset-left)) 0 max(6px,env(safe-area-inset-right));
  background:rgba(246,241,232,.97);border-bottom:1px solid var(--trait);box-shadow:0 2px 10px rgba(60,40,20,.06);
  transform:translateY(-100%);transition:transform .25s ease;visibility:hidden}
.barre.montre{transform:none;visibility:visible}
.barre button{font:inherit;color:var(--encre);background:none;border:0;cursor:pointer;min-height:48px;border-radius:10px}
.barre button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.barre .fleche{flex:0 0 48px;font-size:30px;line-height:1;color:var(--accent)}
.barre .fleche:disabled{opacity:.25;cursor:default}
.barre .ou{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;max-width:720px;margin:0 auto}
.barre .ou .n{flex:none;color:var(--doux);font-size:15px;font-variant-numeric:tabular-nums}
.barre .ou .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--titre);font-size:22px;font-weight:600}
.barre .ou .v{flex:none;color:var(--accent);font-size:14px}
@media (min-width:700px){.barre{justify-content:center;gap:12px}.barre .ou{flex:0 1 auto;margin:0;min-width:320px}}
.liste-fond{position:fixed;inset:0;z-index:11;background:rgba(30,24,18,.35)}
.liste{position:fixed;z-index:12;left:0;right:0;bottom:0;max-height:78vh;max-height:78svh;display:flex;flex-direction:column;
  background:var(--papier);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(30,20,10,.25);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){.liste{top:64px;bottom:auto;left:50%;right:auto;width:440px;transform:translateX(-50%);border-radius:14px;max-height:calc(100vh - 90px)}}
.liste[hidden],.liste-fond[hidden]{display:none}
.liste .tete-liste{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 20px;border-bottom:1px solid var(--trait)}
.liste .tete-liste strong{font-family:var(--titre);font-size:24px;font-weight:600}
.liste .tete-liste button{font:inherit;font-size:16px;background:none;border:1px solid var(--trait);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;color:var(--encre)}
.liste ol{list-style:none;margin:0;padding:6px 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.liste a{display:flex;gap:10px;align-items:baseline;padding:11px 20px;min-height:48px;color:var(--encre);text-decoration:none;font-size:18px}
.liste a .n{min-width:1.8em;color:var(--doux);font-variant-numeric:tabular-nums}
.liste a[aria-current=true]{background:var(--papier-2);color:var(--accent);font-weight:600}
.liste a:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.liste .debut{border-top:1px solid var(--trait);color:var(--doux)}

footer.pied{text-align:center;padding:30px 16px 80px;color:var(--doux)}
.etat{text-align:center;color:var(--doux);padding:40px 16px;font-size:18px}
.etat button{font:inherit;margin-top:12px;padding:12px 22px;border-radius:8px;border:1px solid var(--trait);background:#fff;cursor:pointer}

/* LA GRANDE IMAGE */
.visionneuse{position:fixed;inset:0;z-index:20;background:#15120f;display:none;color:#f3ede3;
  touch-action:pan-y}
.visionneuse.ouverte{display:flex;flex-direction:column}
.visionneuse .scene{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:56px 8px 8px}
.visionneuse img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.visionneuse .legende{min-height:2.4em;padding:10px 20px calc(16px + env(safe-area-inset-bottom));text-align:center;font-size:18px;line-height:1.45;max-width:900px;margin:0 auto}
.visionneuse button{font:inherit;color:#f3ede3;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;cursor:pointer}
.visionneuse .fermer{position:absolute;top:10px;right:12px;font-size:17px;padding:9px 18px}
.visionneuse .prec,.visionneuse .suiv{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;font-size:26px;line-height:1}
.visionneuse .prec{left:10px}.visionneuse .suiv{right:10px}
@media (max-width:699px){.visionneuse .prec,.visionneuse .suiv{top:auto;bottom:calc(70px + env(safe-area-inset-bottom));transform:none;width:48px;height:48px}}

</style>
</head>
<body>
<!-- LE HÉROS (63e) : son nom, puis le pêle-mêle des photos du premier
     chapitre. L'en-tête est un réglage d'Edith (`album_entete`) : ce qui est
     écrit ici n'est que ce qui s'affiche si le réglage ne se lit pas. -->
<section class="heros" id="debut" aria-label="Dov Levy-Neumand">
  <header class="tete">
    <h1 id="t-nom">Dov <span class="insecable">Levy-Neumand</span></h1>
    <p class="dates" id="t-dates">1933-2014</p>
    <p class="nom-he" lang="he" dir="rtl" id="t-nom-he">דוב לוי-נוימנד</p>
    <div class="ligne">
      <p lang="he" dir="rtl" id="t-ligne-he">אבא, סבא, בעל, חבר שלנו</p>
      <p lang="fr" id="t-ligne-fr">Notre père, grand père, mari, ami...</p>
    </div>
  </header>
  <div class="pelemele" id="pelemele" role="group" aria-label="Sa vie en quelques images"></div>
  <a class="vers-sommaire" id="vers-sommaire" href="#sommaire" hidden>Les chapitres ↓</a>
</section>
<!-- LE MONTAGE : derrière le bouton de lecture ; il ne s'ouvre qu'au toucher. -->
<section class="montage" id="montage" role="dialog" aria-modal="true" aria-roledescription="diaporama" aria-label="Montage de photos" hidden>
  <div class="couche"><div class="flou"></div><img alt="" decoding="async"></div>
  <div class="couche"><div class="flou"></div><img alt="" decoding="async"></div>
  <div class="voile"></div>
  <p class="nom" id="m-nom" aria-hidden="true">Dov <span class="insecable">Levy-Neumand</span><span class="an">1933-2014</span></p>
  <p class="passe" id="passe" dir="auto" aria-hidden="true"></p>
  <button type="button" class="fermer-montage" id="fermer-montage">✕ Fermer</button>
  <button type="button" class="musique" id="musique" aria-pressed="false">♪ Mettre la musique</button>
</section>
<div class="barre" id="barre" role="navigation" aria-label="Changer de chapitre">
  <button type="button" class="fleche" id="b-prec" aria-label="Chapitre précédent">‹</button>
  <button type="button" class="ou" id="b-liste" aria-label="Tous les chapitres" aria-haspopup="dialog" aria-expanded="false"><span class="n" id="b-n"></span><span class="t" id="b-t" dir="auto"></span><span class="v" aria-hidden="true">▼</span></button>
  <button type="button" class="fleche" id="b-suiv" aria-label="Chapitre suivant">›</button>
</div>
<div class="liste-fond" id="liste-fond" hidden></div>
<div class="liste" id="liste" role="dialog" aria-label="Les chapitres" hidden>
  <div class="tete-liste"><strong>Les chapitres</strong><button type="button" id="liste-fermer">Fermer ✕</button></div>
  <ol id="liste-ol"></ol>
</div>
<main id="album" class="page"><p class="etat" id="etat">&nbsp;</p></main>
<footer class="pied" id="pied" hidden><a href="#debut">Revenir au début</a></footer>

<div class="visionneuse" id="vis" role="dialog" aria-modal="true" aria-label="Photo agrandie" hidden>
  <button class="fermer" id="vis-fermer" type="button">Fermer ✕</button>
  <div class="scene" id="vis-scene"><img id="vis-img" alt=""></div>
  <button class="prec" id="vis-prec" type="button" aria-label="Photo précédente">‹</button>
  <button class="suiv" id="vis-suiv" type="button" aria-label="Photo suivante">›</button>
  <div class="legende" id="vis-legende" dir="auto"></div>
</div>

<script>
(function(){
"use strict";
var BASE = "https://lweqdxufbtlwvnfakhbv.supabase.co";
var CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZXFkeHVmYnRsd3ZuZmFraGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDY4OTQsImV4cCI6MjEwMjIyMjg5NH0.r3misBiRq6yYTBranyI4LoI0B12os84jMYcpjNeB1xY";
var PHOTOS = BASE + "/storage/v1/object/public/memoire/";
/* L'aperçu d'Edith : son back-office ouvre cette page avec ?apercu et lui
   envoie le chapitre qu'elle n'a pas encore enregistré. */
var ORIGINES_APERCU = ["https://voirisrael.com","https://www.voirisrael.com","http://localhost:8123"];
var APERCU = /[?&]apercu\b/.test(location.search);

var album = document.getElementById("album");
var etat = document.getElementById("etat");
var toutes = []; // toutes les photos, dans l'ordre de lecture, pour la visionneuse

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* Le texte : des paragraphes séparés par une ligne vide. Un paragraphe qui
   commence par « est une citation ; par « — », la signature d'une citation. */
function paragraphes(texte, cls){
  var t = (texte||"").trim(); if(!t) return "";
  var html = t.split(/\n\s*\n/).map(function(p){
    p = p.trim(); if(!p) return "";
    var c = /^«/.test(p) ? ' class="citation"' : /^—\s/.test(p) ? ' class="auteur"' : "";
    return "<p dir=\"auto\""+c+">"+esc(p)+"</p>";
  }).join("");
  return '<div class="'+cls+' colonne">'+html+"</div>";
}

function rendreChapitre(ch, photos, numero){
  var titre = (ch.titre||"").trim(), he = (ch.titre_hebreu||"").trim();
  var h = "";
  if (titre || he) {
    h += "<header>";
    if (numero) h += '<div class="num">'+numero+"</div>";
    if (titre) h += '<h2 dir="auto">'+esc(titre)+"</h2>";
    if (he) h += '<p class="titre-he" lang="he" dir="rtl">'+esc(he)+"</p>";
    h += "</header>";
  }
  /* ⛔ LA PLACE DU RÉCIT D'EDITH : vide, elle n'affiche RIEN. */
  h += paragraphes(ch.recit, "recit");
  h += paragraphes(ch.texte, "texte");
  /* ⛔ 62e — LES PHOTOS VOISINES QUI PORTENT LA MÊME LÉGENDE FORMENT UN GROUPE :
     la légende s'écrit UNE fois, sous le groupe. Les autres photos restent en
     rangs, chacune avec la sienne. (La grande image, elle, montre toujours la
     légende de la photo qu'on regarde.) */
  var morceaux = [];
  photos.forEach(function(p){
    var leg = (p.legende||"").trim(), dernier = morceaux[morceaux.length-1];
    if (leg && dernier && dernier.leg === leg) dernier.photos.push(p);
    else morceaux.push({leg: leg, photos: [p]});
  });
  function figure(p, avecLegende){
    var i = toutes.length; toutes.push(p);
    var w = p.largeur||4, hh = p.hauteur||3, r = (w/hh).toFixed(4);
    var leg = (p.legende||"").trim();
    return '<figure style="--r:'+r+';--w:'+w+';--hh:'+hh+'">'
      + '<button type="button" data-i="'+i+'" aria-label="Agrandir la photo'+(leg?" : "+esc(leg):"")+'">'
      + '<img src="'+PHOTOS+esc(p.vignette)+'" alt="'+esc(leg)+'" loading="lazy" decoding="async" width="'+w+'" height="'+hh+'" onload="this.classList.add(\'vu\')">'
      + "</button>"
      + (leg && avecLegende ? '<figcaption dir="auto">'+esc(leg)+"</figcaption>" : "")
      + "</figure>";
  }
  var rang = "";
  function fermerRang(){ if (rang) { h += '<div class="galerie">'+rang+"</div>"; rang = ""; } }
  morceaux.forEach(function(m){
    if (m.photos.length === 1) { rang += figure(m.photos[0], true); return; }
    fermerRang();
    h += '<div class="groupe"><div class="galerie">' + m.photos.map(function(p){ return figure(p, false); }).join("")
      + '</div><p class="legende-groupe" dir="auto">' + esc(m.leg) + "</p></div>";
  });
  fermerRang();
  return h;
}

/* ⛔ 63e — LE PREMIER CHAPITRE EST LE HÉROS. Ses photos font le pêle-mêle qui
   accueille ; il est le chapitre 1 du sommaire, et y mène en haut de la page.
   Les suivants s'écrivent sous le sommaire, comme avant. */
var heros = null, photosHeros = [];
function rendreAlbum(chapitres, photos){
  toutes = [];
  var parChap = {};
  photos.forEach(function(p){ (parChap[p.chapitre_id] = parChap[p.chapitre_id] || []).push(p); });
  Object.keys(parChap).forEach(function(k){ parChap[k].sort(function(a,b){return a.rang-b.rang}); });
  chapitres.sort(function(a,b){return a.rang-b.rang});
  var html = "", n = 0, sommaire = [];
  chapitres.forEach(function(ch, k){
    var ph = parChap[ch.id] || [];
    var aTitre = (ch.titre||"").trim() || (ch.titre_hebreu||"").trim();
    var vide = !ph.length && !(ch.recit||"").trim() && !(ch.texte||"").trim();
    if (vide) return;
    if (!heros) {
      /* Le héros : ses photos vont au pêle-mêle, son texte (s'il en a un) sous le sommaire. */
      heros = ch; photosHeros = ph;
      ph.forEach(function(p){ p.__i = toutes.length; toutes.push(p); });
      document.getElementById("debut").setAttribute("data-chapitre", ch.id);
      n++; sommaire.push({id: ch.id, n: n, titre: aTitre ? ((ch.titre||"").trim()||ch.titre_hebreu) : "Les photos", heros: true});
      if ((ch.recit||"").trim() || (ch.texte||"").trim())
        html += '<section class="chapitre">' + paragraphes(ch.recit, "recit") + paragraphes(ch.texte, "texte") + "</section>";
      return;
    }
    if (aTitre) { n++; sommaire.push({id:ch.id, n:n, titre:(ch.titre||"").trim()||ch.titre_hebreu}); }
    html += '<section class="chapitre" id="c-'+ch.id+'">'+rendreChapitre(ch, ph, "")+"</section>";
  });
  var lien = function(s){ return s.heros ? "#debut" : "#c-"+s.id; };
  var som = '<nav class="sommaire" id="sommaire" aria-label="Les chapitres"><h2>Les chapitres</h2><ol>'
    + sommaire.map(function(s){return '<li><a href="'+lien(s)+'"'+(s.heros?' data-heros="1"':"")+'><span class="n">'+s.n+'</span><span dir="auto">'+esc(s.titre)+"</span></a></li>"}).join("")
    + '</ol></nav><hr class="fleuron">';
  album.innerHTML = som + html;
  document.getElementById("pied").hidden = false;
  document.getElementById("vers-sommaire").hidden = false;
  poserPeleMele();
  preparerBarre(sommaire);
}

/* ── LE PÊLE-MÊLE (63e) ──────────────────────────────────────────────────────
   Des tirages posés de travers sur la page, entiers (jamais recadrés), qui se
   chevauchent un peu. Celui qui porte le bouton de lecture est le plus grand,
   au milieu, au-dessus des autres. Les places se calculent sur la taille de
   l'écran : on cherche la grille dont les cases ressemblent le plus à une
   photo, on retire les cases que couvre le grand tirage, et l'on pose un
   tirage par case, un peu décalé, un peu tourné — toujours de la même façon,
   pour que la page ne change pas d'une visite à l'autre. */
var peleMele = document.getElementById("pelemele"), photoLecture = null;
var PENTES = [-5, 3.5, -2, 4.5, -3.5, 2, -4.5, 1.5, 3, -1.5];
function choisirPhotoLecture(){
  var vivantes = photosHeros;
  var voulue = reglage && reglage.photo_de_lecture;
  return vivantes.filter(function(p){ return p.id === voulue; })[0]
    || vivantes.filter(function(p){ return p.au_montage; })[0] || vivantes[0] || null;
}
function poserPeleMele(){
  if (!photosHeros.length) { peleMele.hidden = true; return; }
  photoLecture = choisirPhotoLecture();
  var W = peleMele.clientWidth, H = peleMele.clientHeight;
  if (W < 50 || H < 50) return;
  var etroit = W < 700;
  var autres = photosHeros.filter(function(p){ return p !== photoLecture; });
  /* Le grand tirage : au milieu, à sa proportion. */
  var pl = photoLecture, ar = (pl.largeur||4)/(pl.hauteur||3);
  var bw = Math.min(W * (etroit ? 0.66 : 0.40), H * (etroit ? 0.50 : 0.62) * ar), bh = bw / ar;
  var big = {x: W/2 - bw/2, y: H*0.47 - bh/2, w: bw, h: bh};
  /* La grille : assez de cases libres, des cases au plus près d'une photo 4:3. */
  var best = null;
  for (var c = 3; c <= 9; c++) for (var r = 3; r <= 9; r++) {
    var cw = W/c, chh = H/r, libres = [];
    for (var y = 0; y < r; y++) for (var x = 0; x < c; x++) {
      var cx = (x+.5)*cw, cy = (y+.5)*chh;
      if (cx > big.x + bw*.12 && cx < big.x + bw*.88 && cy > big.y + bh*.12 && cy < big.y + bh*.88) continue;
      libres.push({cx: cx, cy: cy});
    }
    if (libres.length < autres.length) continue;
    var score = Math.abs(Math.log((cw/chh)/1.25)) + 0.12 * (libres.length - autres.length);
    if (!best || score < best.score) best = {score: score, cw: cw, ch: chh, libres: libres};
  }
  if (!best) return;
  /* Trop de cases ? on en retire, réparties sur toute la grille. */
  var cases = best.libres, prises = [];
  for (var k = 0; k < autres.length; k++) prises.push(cases[Math.floor(k * cases.length / autres.length)]);
  var html = "";
  autres.forEach(function(p, k){
    var a = (p.largeur||4)/(p.hauteur||3), boite = Math.min(best.cw, best.ch * a) * (etroit ? 1.18 : 1.08);
    var w = Math.min(boite, best.cw * 1.25), h = w / a;
    if (h > best.ch * 1.3) { h = best.ch * 1.3; w = h * a; }
    var dx = ((k * 37) % 11 - 5) / 5 * best.cw * 0.10, dy = ((k * 53) % 9 - 4) / 4 * best.ch * 0.08;
    var x = Math.max(2, Math.min(W - w - 2, prises[k].cx - w/2 + dx)), y = Math.max(2, Math.min(H - h - 2, prises[k].cy - h/2 + dy));
    html += tirage(p, x, y, w, h, PENTES[k % PENTES.length], k);
  });
  html += tirage(pl, big.x, big.y, big.w, big.h, -1.2, autres.length, true);
  peleMele.innerHTML = html;
}
function tirage(p, x, y, w, h, pente, ordre, lecture){
  var leg = (p.legende||"").trim();
  var nom = lecture ? "Lancer le montage (lecture)" : "Agrandir la photo" + (leg ? " : " + leg : "");
  var taille = Math.round(lecture ? w * 2 : w * 2);
  return '<button type="button" class="tirage' + (lecture ? " lecture" : "") + '"'
    + (lecture ? ' id="lecture"' : ' data-i="' + p.__i + '"')
    + ' aria-label="' + esc(nom) + '" style="left:' + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;width:" + w.toFixed(1) + "px;height:" + h.toFixed(1)
    + "px;transform:rotate(" + pente + "deg);transition-delay:" + (ordre * 45) + 'ms">'
    + '<img src="' + PHOTOS + esc(p.vignette) + '"' + (taille > 640 ? ' srcset="' + PHOTOS + esc(p.vignette) + " 640w, " + PHOTOS + esc(p.fichier) + ' 1600w" sizes="' + Math.round(w) + 'px"' : "")
    + ' alt="' + esc(leg) + '" decoding="async" onload="this.parentNode.classList.add(\'vu\')" onerror="this.parentNode.classList.add(\'vu\')">'
    + (lecture ? '<span class="play" aria-hidden="true"><span class="rond"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14.5-8.5z"/></svg></span><span class="mot">Regarder le montage</span></span>' : "")
    + "</button>";
}
peleMele.addEventListener("click", function(e){
  var b = e.target.closest(".tirage"); if (!b) return;
  if (b.id === "lecture") ouvrirMontage(); else ouvrir(+b.dataset.i);
});
var attenteTaille = null, largeurPosee = 0, hauteurPosee = 0;
window.addEventListener("resize", function(){
  clearTimeout(attenteTaille);
  attenteTaille = setTimeout(function(){
    /* La barre d'adresse d'un téléphone qui se replie change la hauteur de
       quelques pixels : on ne redessine que pour un vrai changement. */
    if (Math.abs(peleMele.clientWidth - largeurPosee) > 8 || Math.abs(peleMele.clientHeight - hauteurPosee) > 60) { poserPeleMele(); marquerVus(); }
  }, 150);
});
function marquerVus(){
  largeurPosee = peleMele.clientWidth; hauteurPosee = peleMele.clientHeight;
  [].forEach.call(peleMele.querySelectorAll("img"), function(im){ if (im.complete) im.parentNode.classList.add("vu"); });
}

/* ── ALLER QUELQUE PART : TOUJOURS D'UN COUP ─────────────────────────────────
   ⛔ 62e — le défilement « doux » traversait 300 photos et faisait attendre
   1,6 s sur un téléphone (mesuré). Un saut se pose immédiatement. */
function aller(id){
  var c = document.getElementById(id); if (!c) return;
  c.scrollIntoView({block:"start", behavior:"instant"});
  try { history.replaceState(null, "", "#"+id); } catch(e) {}
}
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest('a[href^="#c-"],a[href="#debut"],a[href="#sommaire"]');
  if (!a || a.id === "vers-debut") return;
  e.preventDefault(); fermerListe();
  var id = a.getAttribute("href").slice(1);
  if (id === "debut") { window.scrollTo(0, 0); try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {} }
  else aller(id);
});

/* ── LA BARRE DES CHAPITRES ─────────────────────────────────────────────────
   Elle paraît dès qu'on est entré dans les chapitres : elle dit lequel (et
   « 12 / 21 »), mène au précédent ou au suivant d'un toucher, et ouvre la
   liste de tous les chapitres. */
var barre = document.getElementById("barre"), chaps = [], courantChap = -1;
var liste = document.getElementById("liste"), listeFond = document.getElementById("liste-fond"), listeOl = document.getElementById("liste-ol");
var bListe = document.getElementById("b-liste");
function preparerBarre(sommaire){
  chaps = sommaire.map(function(s){ var id = s.heros ? "debut" : "c-"+s.id; return {id: id, n: s.n, titre: s.titre, el: document.getElementById(id)}; });
  listeOl.innerHTML = chaps.map(function(c){
    return '<li><a href="#'+c.id+'"><span class="n">'+c.n+'</span><span dir="auto">'+esc(c.titre)+"</span></a></li>";
  }).join("") + '<li><a href="#debut" class="debut" id="vers-debut"><span class="n">↑</span><span>Revenir au début</span></a></li>';
  document.getElementById("vers-debut").onclick = function(e){ e.preventDefault(); fermerListe(); window.scrollTo(0,0); };
  suivreLaLecture();
}
function suivreLaLecture(){
  if (!chaps.length) return;
  var i = -1;
  for (var k = 0; k < chaps.length; k++) { if (chaps[k].el && chaps[k].el.getBoundingClientRect().top <= 72) i = k; else break; }
  /* 63e — le héros est le chapitre 1 : la barre attend qu'on soit entré dans
     le chapitre 2, c'est-à-dire qu'on ait dépassé le sommaire. */
  barre.classList.toggle("montre", i >= 1);
  if (i === courantChap) return;
  courantChap = i;
  if (i < 0) return;
  document.getElementById("b-n").textContent = chaps[i].n + " / " + chaps.length;
  document.getElementById("b-t").textContent = chaps[i].titre;
  document.getElementById("b-prec").disabled = false;
  document.getElementById("b-suiv").disabled = i >= chaps.length-1;
}
var attente = false;
window.addEventListener("scroll", function(){
  if (attente) return; attente = true;
  requestAnimationFrame(function(){ attente = false; suivreLaLecture(); });
}, {passive:true});
document.getElementById("b-prec").onclick = function(){
  if (courantChap > 0) aller(chaps[courantChap-1].id);
  else { var s = document.querySelector("nav.sommaire"); if (s) s.scrollIntoView({block:"start", behavior:"instant"}); }
};
document.getElementById("b-suiv").onclick = function(){ if (courantChap < chaps.length-1) aller(chaps[courantChap+1].id); };
function ouvrirListe(){
  liste.hidden = false; listeFond.hidden = false; bListe.setAttribute("aria-expanded","true");
  [].forEach.call(listeOl.querySelectorAll("a"), function(a, k){ a.setAttribute("aria-current", k === courantChap ? "true" : "false"); });
  var cur = listeOl.querySelectorAll("a")[Math.max(courantChap,0)];
  if (cur) { cur.scrollIntoView({block:"center", behavior:"instant"}); cur.focus({preventScroll:true}); }
}
function fermerListe(){
  if (liste.hidden) return;
  liste.hidden = true; listeFond.hidden = true; bListe.setAttribute("aria-expanded","false");
}
bListe.onclick = function(){ liste.hidden ? ouvrirListe() : fermerListe(); };
listeFond.onclick = fermerListe;
document.getElementById("liste-fermer").onclick = function(){ fermerListe(); bListe.focus(); };
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !liste.hidden) { fermerListe(); bListe.focus(); } });

/* ── LE MONTAGE D'OUVERTURE ─────────────────────────────────────────────────
   Les photos qu'Edith a cochées « dans le montage », dans l'ordre de l'album.
   Les mots qui passent sont les siens : la ligne de l'en-tête, puis la
   légende d'une photo quand elle est SÛRE (jamais une légende « à relire »),
   ou à défaut le titre de son chapitre. */
var montage = document.getElementById("montage"), couches = montage.querySelectorAll(".couche"),
    passe = document.getElementById("passe");
var diapos = [], idx = -1, minuteur = null, ouvertMontage = false, focusAvantMontage = null;
var DUREE = 6000;
function preparerMontage(chapitres, photos){
  var rangChap = {}, titreChap = {};
  chapitres.forEach(function(c){ rangChap[c.id] = c.rang; titreChap[c.id] = (c.titre||"").trim() || (c.titre_hebreu||"").trim(); });
  var LIGNES = [entete.ligne_hebreu, entete.ligne_francais].map(function(l){ return (l||"").trim(); }).filter(Boolean);
  var choisies = photos.filter(function(p){ return p.au_montage && rangChap[p.chapitre_id] !== undefined; })
    .sort(function(a,b){ return (rangChap[a.chapitre_id]-rangChap[b.chapitre_id]) || (a.rang-b.rang); });
  /* Le montage commence par la photo qu'on vient de toucher. */
  if (photoLecture) {
    var k0 = choisies.indexOf(photoLecture);
    choisies = k0 >= 0 ? choisies.slice(k0).concat(choisies.slice(0, k0)) : [photoLecture].concat(choisies);
  }
  diapos = choisies.map(function(p, k){
    var mot = k >= 1 && k <= LIGNES.length ? LIGNES[k-1]
      : (!p.legende_a_relire && (p.legende||"").trim()) || titreChap[p.chapitre_id] || "";
    return {p: p, mot: mot};
  });
  document.addEventListener("visibilitychange", relancer);
}
function ouvrirMontage(){
  if (!diapos.length) return;
  focusAvantMontage = document.activeElement;
  montage.hidden = false; ouvertMontage = true;
  document.body.style.overflow = "hidden";
  couches[0].classList.remove("active"); couches[1].classList.remove("active");
  passe.textContent = ""; passe.classList.remove("vue");
  document.getElementById("fermer-montage").focus();
  montrerDiapo(0);
}
function fermerMontage(){
  if (!ouvertMontage) return;
  ouvertMontage = false; clearTimeout(minuteur);
  if (musique.getAttribute("aria-pressed") === "true") allumerMusique(false);
  montage.hidden = true; document.body.style.overflow = "";
  if (focusAvantMontage && focusAvantMontage.focus) focusAvantMontage.focus({preventScroll: true});
}
document.getElementById("fermer-montage").onclick = fermerMontage;
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && ouvertMontage) fermerMontage(); });
function chargerImage(p){
  return new Promise(function(ok){
    var im = new Image(); im.decoding = "async";
    im.sizes = "100vw"; im.srcset = PHOTOS+p.vignette+" 640w, "+PHOTOS+p.fichier+" 1600w";
    im.src = PHOTOS + p.fichier;
    im.onload = im.onerror = function(){ ok(im.currentSrc || im.src); };
  });
}
function montrerDiapo(k){
  var d = diapos[k]; if (!d) return;
  chargerImage(d.p).then(function(src){
    if (!ouvertMontage) return;
    idx = k;
    var c = couches[k % 2], autre = couches[(k+1) % 2], img = c.querySelector("img");
    img.src = src;
    c.querySelector(".flou").style.backgroundImage = 'url("'+PHOTOS+d.p.vignette+'")';
    img.style.setProperty("--ox", (k % 3 === 0 ? 35 : k % 3 === 1 ? 65 : 50) + "%");
    img.style.setProperty("--oy", (k % 2 ? 40 : 60) + "%");
    /* relancer le mouvement lent sur la couche qui entre */
    c.classList.remove("active"); void c.offsetWidth; c.classList.add("active"); autre.classList.remove("active");
    passe.classList.remove("vue");
    setTimeout(function(){ passe.textContent = d.mot; if (d.mot) passe.classList.add("vue"); }, 700);
    relancer();
  });
}
function relancer(){
  clearTimeout(minuteur);
  if (!ouvertMontage || document.hidden || diapos.length < 2) return;
  minuteur = setTimeout(function(){ montrerDiapo((idx+1) % diapos.length); }, DUREE);
}

/* ── L'EN-TÊTE : CE QU'EDITH A ÉCRIT (63e, O100 ④) ────────────────────────────
   Le nom, les années, le nom en hébreu et les deux lignes viennent de son
   réglage `album_entete` ; la photo du bouton de lecture aussi. Si le réglage
   ne se lit pas, la page garde ce qui est écrit plus haut. */
var reglage = null;
var entete = {nom: "Dov Levy-Neumand", dates: "1933-2014", nom_hebreu: "דוב לוי-נוימנד",
  ligne_hebreu: "אבא, סבא, בעל, חבר שלנו", ligne_francais: "Notre père, grand père, mari, ami..."};
function nomInsecable(nom){
  /* « Dov Levy-Neumand » : le nom de famille ne se coupe jamais en deux lignes. */
  var t = esc(nom.trim()), i = t.indexOf(" ");
  return i < 0 ? t : t.slice(0, i) + ' <span class="insecable">' + t.slice(i + 1) + "</span>";
}
function appliquerEntete(r){
  reglage = r || null;
  if (r) ["nom","dates","nom_hebreu","ligne_hebreu","ligne_francais"].forEach(function(k){ if (typeof r[k] === "string") entete[k] = r[k]; });
  document.getElementById("t-nom").innerHTML = nomInsecable(entete.nom);
  document.getElementById("t-dates").textContent = entete.dates.trim();
  document.getElementById("t-nom-he").textContent = entete.nom_hebreu.trim();
  document.getElementById("t-ligne-he").textContent = entete.ligne_hebreu.trim();
  document.getElementById("t-ligne-fr").textContent = entete.ligne_francais.trim();
  document.getElementById("m-nom").innerHTML = nomInsecable(entete.nom) + (entete.dates.trim() ? '<span class="an">' + esc(entete.dates.trim()) + "</span>" : "");
  document.title = entete.nom.trim() + (entete.dates.trim() ? " " + entete.dates.trim() : "");
  document.getElementById("debut").setAttribute("aria-label", entete.nom.trim());
}

/* ── LA MUSIQUE ─────────────────────────────────────────────────────────────
   ⛔ ELLE NE DÉMARRE JAMAIS TOUTE SEULE : rien ne se crée avant le toucher.
   Elle est COMPOSÉE ICI, note à note, par le navigateur (Web Audio) : aucun
   fichier à télécharger, aucun droit d'auteur — un piano lent en ré majeur sur
   quatre accords, avec un écho de salle. Écrite pour cette page (62e) et
   placée dans le domaine public (CC0). */
var musique = document.getElementById("musique"), audio = null;
function creerMusique(){
  var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null;
  var ctx = new Ctx(); window.__contexteAudio = ctx;
  var maitre = ctx.createGain(); maitre.gain.value = 0;
  var salle = ctx.createConvolver(), n = Math.floor(ctx.sampleRate * 3.2), ir = ctx.createBuffer(2, n, ctx.sampleRate);
  for (var ch = 0; ch < 2; ch++) { var dd = ir.getChannelData(ch); for (var i = 0; i < n; i++) dd[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3.2); }
  salle.buffer = ir;
  var sec = ctx.createGain(); sec.gain.value = 0.55;
  var mouille = ctx.createGain(); mouille.gain.value = 0.45;
  var doux = ctx.createBiquadFilter(); doux.type = "lowpass"; doux.frequency.value = 2600;
  doux.connect(sec); doux.connect(salle); salle.connect(mouille);
  var garde = ctx.createDynamicsCompressor(); garde.threshold.value = -14; garde.ratio.value = 4; garde.attack.value = 0.01; garde.release.value = 0.4;
  sec.connect(maitre); mouille.connect(maitre); maitre.connect(garde); garde.connect(ctx.destination);
  var timbre = ctx.createPeriodicWave(new Float32Array([0,1,0.35,0.12,0.05,0.02]), new Float32Array(6));
  var hz = function(m){ return 440 * Math.pow(2, (m-69)/12); };
  /* ré maj7 · si min7 · sol maj7 · la sus4 → la */
  var ACCORDS = [[50,57,62,66,69,73],[47,54,62,66,69,71],[43,50,59,62,66,71],[45,52,62,64,69,73]];
  function note(m, t, duree, force){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.setPeriodicWave(timbre); o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(force, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + duree);
    o.connect(g); g.connect(doux); o.start(t); o.stop(t + duree + 0.05);
  }
  var temps = ctx.currentTime + 0.3, mesure = 0, MESURE = 4.8;
  function programmer(){
    while (temps < ctx.currentTime + 2) {
      var a = ACCORDS[mesure % 4];
      note(a[0], temps, 5.5, 0.7);                   // la basse, posée
      note(a[1], temps + 0.02, 4.5, 0.38);
      var motifs = [[2,3,4,5],[3,5,4,2],[4,3,5,3],[2,4,5,4]], mo = motifs[(mesure + (mesure >> 2)) % 4];
      for (var b = 0; b < 4; b++) if (!(b === 3 && mesure % 2)) note(a[mo[b]], temps + 0.6 + b * 1.05, 3.2, 0.34 + Math.random() * 0.1);
      temps += MESURE; mesure++;
    }
  }
  programmer();
  var tic = setInterval(programmer, 500);
  return {ctx: ctx, maitre: maitre, tic: tic};
}
function allumerMusique(oui){
  if (oui) {
    if (!audio) audio = creerMusique();
    if (!audio) return;
    audio.ctx.resume();
    audio.maitre.gain.cancelScheduledValues(audio.ctx.currentTime);
    audio.maitre.gain.setTargetAtTime(0.8, audio.ctx.currentTime, 0.8);
  } else if (audio) {
    audio.maitre.gain.cancelScheduledValues(audio.ctx.currentTime);
    audio.maitre.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.25);
    var ctx = audio.ctx; setTimeout(function(){ if (musique.getAttribute("aria-pressed") === "false") ctx.suspend(); }, 1200);
  }
  musique.setAttribute("aria-pressed", oui ? "true" : "false");
  musique.textContent = oui ? "♪ Couper la musique" : "♪ Mettre la musique";
}
musique.onclick = function(){ allumerMusique(musique.getAttribute("aria-pressed") !== "true"); };
document.addEventListener("visibilitychange", function(){
  if (!audio) return;
  if (document.hidden) audio.ctx.suspend();
  else if (musique.getAttribute("aria-pressed") === "true") audio.ctx.resume();
});

/* ── LA VISIONNEUSE ─────────────────────────────────────────────────────── */
var vis = document.getElementById("vis"), visImg = document.getElementById("vis-img"),
    visLeg = document.getElementById("vis-legende");
var courant = -1, dernierFocus = null;
function montrer(i){
  if (i<0 || i>=toutes.length) return;
  courant = i; var p = toutes[i];
  /* La vignette d'abord (déjà chargée, elle s'affiche tout de suite), la
     grande image dès qu'elle arrive — en 4G, on ne regarde jamais un écran noir. */
  visImg.src = PHOTOS + p.vignette;
  var grande = new Image();
  grande.onload = function(){ if (courant === i) visImg.src = grande.src; };
  grande.src = PHOTOS + p.fichier;
  visImg.alt = p.legende || "";
  visLeg.textContent = (p.legende||"").trim();
  document.getElementById("vis-prec").style.visibility = i > 0 ? "visible" : "hidden";
  document.getElementById("vis-suiv").style.visibility = i < toutes.length-1 ? "visible" : "hidden";
  [i+1,i-1].forEach(function(j){ if(toutes[j]){ var im=new Image(); im.src=PHOTOS+toutes[j].fichier; } });
}
function ouvrir(i){ dernierFocus = document.activeElement; vis.hidden=false; vis.classList.add("ouverte");
  document.body.style.overflow="hidden"; montrer(i); document.getElementById("vis-fermer").focus(); }
function fermer(){ vis.classList.remove("ouverte"); vis.hidden=true; document.body.style.overflow="";
  visImg.removeAttribute("src"); if (dernierFocus) dernierFocus.focus(); }
album.addEventListener("click", function(e){ var b = e.target.closest("button[data-i]"); if(b) ouvrir(+b.dataset.i); });
document.getElementById("vis-fermer").onclick = fermer;
document.getElementById("vis-prec").onclick = function(){ montrer(courant-1); };
document.getElementById("vis-suiv").onclick = function(){ montrer(courant+1); };
document.getElementById("vis-scene").addEventListener("click", function(e){ if(e.target===this) fermer(); });
document.addEventListener("keydown", function(e){
  if (vis.hidden) return;
  if (e.key==="Escape") fermer(); else if (e.key==="ArrowRight") montrer(courant+1); else if (e.key==="ArrowLeft") montrer(courant-1);
});
var x0 = null;
vis.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
vis.addEventListener("touchend", function(e){ if(x0===null) return; var dx = e.changedTouches[0].clientX - x0; x0=null;
  if (Math.abs(dx) > 50) montrer(courant + (dx<0 ? 1 : -1)); });


/* ── LE CHARGEMENT ───────────────────────────────────────────────────────── */
function lire(chemin){
  return fetch(BASE + "/rest/v1/" + chemin, {headers:{apikey:CLE, Authorization:"Bearer "+CLE}})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function charger(){
  etat.textContent = " ";
  Promise.all([
    lire("memoire_chapitres?select=id,rang,titre,titre_hebreu,recit,texte&order=rang"),
    lire("memoire_photos?select=id,chapitre_id,rang,fichier,vignette,largeur,hauteur,legende,legende_a_relire,au_montage&order=rang&limit=5000"),
    /* Le réglage d'Edith : s'il ne se lit pas, la page s'ouvre quand même. */
    lire("site_settings?key=eq.album_entete&select=value").then(function(r){ return r && r[0] ? r[0].value : null; }, function(){ return null; })
  ]).then(function(r){
    appliquerEntete(r[2]);
    rendreAlbum(r[0], r[1]);
    marquerVus();
    preparerMontage(r[0], r[1]);
    /* Arriver par un lien vers un chapitre : on y va. */
    if (location.hash && document.getElementById(location.hash.slice(1))) aller(location.hash.slice(1));
  })
    .catch(function(){
      etat.innerHTML = "La page n'a pas pu se charger. Vérifiez la connexion, puis réessayez.<br><button type=\"button\">Réessayer</button>";
      etat.querySelector("button").onclick = charger;
    });
}

if (APERCU) {
  /* L'aperçu ne lit rien en base : il montre ce qu'Edith est en train d'écrire. */
  window.addEventListener("message", function(e){
    if (ORIGINES_APERCU.indexOf(e.origin) < 0 || !e.data || e.data.type !== "apercu-memoire") return;
    var d = e.data;
    toutes = [];
    var ch = d.chapitre, ph = (d.photos||[]).filter(function(p){ return !p.masquee; });
    album.innerHTML = '<section class="chapitre">' + rendreChapitre(ch, ph, "") + "</section>";
  });
  document.getElementById("debut").style.display = "none";
  if (window.parent !== window) window.parent.postMessage({type:"apercu-memoire-pret"}, "*");
} else {
  charger();
}
})();
</script>
